[project]
name = "metar-reader"
version = "0.1.0"
description = "Flask app that decodes airport METAR reports into plain English"
requires-python = ">=3.10"
dependencies = [
    "flask>=3.0",
    "requests>=2.31",
]

[dependency-groups]
dev = ["pytest>=8"]

[tool.uv]
package = false

[tool.pytest.ini_options]
pythonpath = ["."]
